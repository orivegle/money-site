name: Reset and Recollect Deals

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Reset database and recollect
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python reset_and_collect.py
